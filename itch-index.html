<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Mirexis Demo</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #051014;
        }
        body { display: grid; place-items: center; }
        #glcanvas {
            display: block;
            width: min(100vw, calc(100vh * 16 / 9));
            height: min(100vh, calc(100vw * 9 / 16));
            outline: none;
            touch-action: none;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            color: #bce8dc;
            font: 600 18px system-ui, sans-serif;
            background: #051014;
            z-index: 1;
        }
        #loading[hidden] { display: none; }
    </style>
</head>
<body>
    <div id="loading">Entering the mire…</div>
    <canvas id="glcanvas" tabindex="1" aria-label="Mirexis demo game"></canvas>

    <script src="shared-assets/runtime/mq_js_bundle.js"></script>
    <script src="shared-assets/runtime/sapp_jsutils.js"></script>
    <script src="shared-assets/runtime/macroquad-gamepads-0.1.js"></script>
    <script src="shared-assets/runtime/storage.js"></script>
    <script>
        (function () {
            var canvas = document.getElementById('glcanvas');
            var loading = document.getElementById('loading');

            function syncCanvas() {
                if (window.wasm_exports) window.dispatchEvent(new Event('resize'));
            }

            (function waitForGame() {
                if (window.wasm_exports) {
                    requestAnimationFrame(function () {
                        loading.hidden = true;
                        canvas.focus();
                        syncCanvas();
                        if (window.ResizeObserver) new ResizeObserver(syncCanvas).observe(canvas);
                    });
                } else {
                    requestAnimationFrame(waitForGame);
                }
            })();

            canvas.addEventListener('pointerdown', function () { canvas.focus(); });
            canvas.addEventListener('contextmenu', function (event) { event.preventDefault(); });
            canvas.addEventListener('dblclick', function (event) { event.preventDefault(); });
            canvas.addEventListener('touchmove', function (event) { event.preventDefault(); }, { passive: false });
            window.addEventListener('keydown', function (event) {
                if (document.activeElement === canvas
                    && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Spacebar'].includes(event.key)) {
                    event.preventDefault();
                }
            }, { passive: false });
        })();

        load("mirexis.wasm");
    </script>
</body>
</html>
