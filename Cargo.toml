[package]
name = "mirexis"
version = "0.1.0"
edition = "2021"

[features]
default = []
demo = []

[dependencies]
# Procedural SFX and ambience use macroquad's audio backend.
macroquad = { version = "0.4", features = ["audio"] }
macroquad-toolkit = { path = "../macroquad-toolkit" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
